name: Terraform ECS Cluster Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  AWS_ACCOUNT: ti-sandbox

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # Required for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set AWS Role ARN
        id: set-role
        run: |
          case "${{ env.AWS_ACCOUNT }}" in
            "ti-sandbox")
              echo "AWS_ROLE_ARN=arn:aws:iam::014744699880:role/jenkins-assume-child" >> $GITHUB_ENV
              ;;
            "toldev")
              echo "AWS_ROLE_ARN=arn:aws:iam::729320268350:role/jenkins-assume-child" >> $GITHUB_ENV
              ;;
            "tol")
              echo "AWS_ROLE_ARN=arn:aws:iam::958516987696:role/jenkins-assume-child" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown AWS account: ${{ env.AWS_ACCOUNT }}"
              exit 1
              ;;
          esac
          echo "Using IAM Role: $AWS_ROLE_ARN"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ env.AWS_ROLE_ARN }}"
          aws-region: "${{ env.AWS_REGION }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TF_VERSION }}"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Create Backend Configuration
        run: make create-backend-config
        env:
          TFSTATE_PROFILE: default
          TFSTATE_REGION: us-east-1
          TFSTATE_BUCKET: backstage-terraform-state
          TFSTATE_KEY: ecs-clusters/nikhil-test/terraform.tfstate
          TFSTATE_DYNAMODB_TABLE: backstage-terraform-locks

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan' || github.event.inputs.action == ''
        run: "make plan ENV=${{ env.ENVIRONMENT }}"
        continue-on-error: false

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: "${{ steps.plan.outputs.stdout }}"
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN_OUTPUT}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.inputs.action == 'apply'
        run: "make apply ENV=${{ env.ENVIRONMENT }}"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: "make destroy ENV=${{ env.ENVIRONMENT }}"

      - name: Terraform Output
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.inputs.action == 'apply'
        id: output
        run: "make output ENV=${{ env.ENVIRONMENT }}"

      - name: Post Deployment Summary
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.inputs.action == 'apply'
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** nikhil-test" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outputs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.output.outputs.stdout }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
